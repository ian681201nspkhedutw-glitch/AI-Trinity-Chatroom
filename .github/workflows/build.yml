
name: Build AI Trinity Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-trinity-android.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q ai-trinity-android.zip -d extracted
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV
          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trinity-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
